[package]
name = "igraph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "rust-igraph: pure-Rust port of the igraph network analysis library"

[features]
default = []
# Enable to run the live python-igraph oracle integration tests.
# Requires .venv/ at the repo root with python-igraph installed
# (see scripts/requirements.txt).
oracle-tests = []
# Enable to run the proptest invariants integration tests.
# Marker-only: proptest is always available for tests via dev-dependencies;
# this feature merely gates the test bodies so quick `cargo test` runs do not
# pay the proptest cost unless explicitly requested.
proptest-harness = []

[dependencies]
igraph-core.workspace = true
igraph-algorithms.workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
proptest.workspace = true
criterion.workspace = true

[[example]]
name = "bfs_karate"
path = "../../examples/bfs_karate.rs"

[[bench]]
name = "bench_bfs"
path = "../../benches/bench_bfs.rs"
harness = false

[lints]
workspace = true
