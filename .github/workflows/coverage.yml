name: Coverage

# Codecov-related work runs in its own workflow so that the daily-driver
# CI (.github/workflows/ci.yml) stays fast and Python-free, while this
# file owns everything that needs the python-igraph oracle venv:
#   - llvm-cov line/branch coverage (cargo-llvm-cov → lcov.info)
#   - test analytics (cargo-nextest → junit.xml)
# Both upload to Codecov; both tolerate flake (`fail_ci_if_error: false`).

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  llvm-cov:
    name: line coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    # Coverage runs every suite the rest of CI runs in a single
    # instrumentation pass — `--all-features` flips on both
    # `oracle-tests` and `proptest-harness`. Drops `-D warnings`
    # because llvm-cov's instrumentation can surface dead-code lints
    # that the regular jobs don't see.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      # Oracle tests need python-igraph at runtime.
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install python-igraph (for oracle suite)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r scripts/requirements.txt

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with: { tool: cargo-llvm-cov }

      - name: Generate lcov coverage report
        # `--doctests` would require nightly (rustdoc's
        # `-Z unstable-options --persist-doctests`); the `doc` job
        # already compiles every doctest with -D warnings, so the
        # marginal coverage from instrumenting them is not worth a
        # toolchain split.
        run: |
          cargo llvm-cov --workspace --all-features \
            --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-results:
    name: test analytics (cargo-nextest → JUnit)
    runs-on: ubuntu-latest
    # Run regardless of llvm-cov's outcome so that test analytics keeps
    # flowing even if coverage instrumentation is the thing that broke.
    if: ${{ !cancelled() }}
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install python-igraph (for oracle suite)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r scripts/requirements.txt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }

      - name: Run nextest with JUnit report
        # The `ci` profile lives in .config/nextest.toml; it writes
        # target/nextest/ci/junit.xml. `--no-fail-fast` is implied by
        # the profile (fail-fast = false there).
        run: |
          cargo nextest run --workspace --all-features --profile ci

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: target/nextest/ci/junit.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
