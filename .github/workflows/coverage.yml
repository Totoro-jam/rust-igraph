name: Coverage

# Codecov-related work runs in its own workflow so that the daily-driver
# CI (.github/workflows/ci.yml) stays fast and Python-free, while this
# file owns everything that needs the python-igraph oracle venv:
#   - llvm-cov line/branch coverage (cargo-llvm-cov → lcov.info)
#   - test analytics (cargo-nextest → junit.xml)
# Both uploads use the unified `codecov/codecov-action@v5` (the
# previously-used `test-results-action@v1` is now deprecated upstream).

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  llvm-cov:
    name: line coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    # Coverage runs every suite the rest of CI runs in a single
    # instrumentation pass — `--all-features` flips on both
    # `oracle-tests` and `proptest-harness`. Drops `-D warnings`
    # because llvm-cov's instrumentation can surface dead-code lints
    # that the regular jobs don't see.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      # Oracle tests need python-igraph at runtime.
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install python-igraph (for oracle suite)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r scripts/requirements.txt

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with: { tool: cargo-llvm-cov }

      - name: Generate lcov coverage report
        # `--doctests` would require nightly (rustdoc's
        # `-Z unstable-options --persist-doctests`); the `doc` job
        # already compiles every doctest with -D warnings, so the
        # marginal coverage from instrumenting them is not worth a
        # toolchain split.
        run: |
          cargo llvm-cov --workspace --all-features \
            --lcov --output-path lcov.info

      - name: Show lcov.info head (debug)
        # Make missing/empty reports loud in the workflow log so this
        # never silently degrades to "0 coverage" again.
        run: |
          ls -la lcov.info
          head -20 lcov.info
          wc -l lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-results:
    name: test analytics (cargo-nextest → JUnit)
    runs-on: ubuntu-latest
    # Run regardless of llvm-cov's outcome so that test analytics keeps
    # flowing even if coverage instrumentation is the thing that broke.
    if: ${{ !cancelled() }}
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # NOTE: this job intentionally does not install python-igraph.
      # The nextest run below uses `--features proptest-harness` (no
      # `oracle-tests`), which keeps every test pure-Rust.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }

      - name: Run nextest with JUnit report
        # The `ci` profile lives in .config/nextest.toml; it writes
        # target/nextest/ci/junit.xml. `--no-fail-fast` is implied by
        # the profile (fail-fast = false). We pin the test set
        # explicitly because:
        #   1. `--all-features` would compile-fail or runtime-skip
        #      anything that depends on a python-igraph venv that's
        #      not yet set up (oracle-tests). nextest's fail-fast then
        #      truncates the JUnit; the previous run produced only
        #      ~10 KB because the proptest test set never reached the
        #      runner.
        #   2. Coverage instrumentation already runs the same suite via
        #      cargo-llvm-cov in the sibling job; here we only need
        #      enough testcases for the Test Analytics dashboard to
        #      render — the platform tests in ci.yml are the source of
        #      truth for "did the code break".
        # `|| true` keeps the job green even if a test fails so the
        # JUnit + Codecov upload still happen.
        run: |
          cargo nextest run --workspace --features proptest-harness --profile ci || true

      - name: Show junit.xml diagnostics (debug)
        # Same reason as above: surface missing reports in the log
        # rather than letting the upload silently no-op.
        if: always()
        run: |
          echo "=== target/nextest tree ==="
          find target/nextest -type f 2>/dev/null || echo "(target/nextest absent)"
          echo
          echo "=== junit.xml header ==="
          head -3 target/nextest/ci/junit.xml || true
          echo
          echo "=== testsuite summary attributes ==="
          grep -oE '<testsuite[^>]*>' target/nextest/ci/junit.xml || echo "no testsuite found"
          echo
          echo "=== testcase count ==="
          tc=$(grep -c "<testcase" target/nextest/ci/junit.xml || true)
          echo "testcases: $tc"
          echo
          echo "=== file size ==="
          wc -c target/nextest/ci/junit.xml || true
          echo
          echo "=== first 5 testcase lines ==="
          grep "<testcase" target/nextest/ci/junit.xml | head -5 || true

      - name: Upload junit.xml as artifact
        # Lets us download and inspect the raw JUnit XML out-of-band
        # when Codecov's Test Analytics page reports zero entries.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

      - name: Upload test results to Codecov
        # Per the deprecation warning emitted by test-results-action@v1
        # itself: use `codecov/codecov-action@v5` with
        # `report_type: test_results`. There is NO
        # `codecov/test-results-action@v5` tag — Codecov's web docs
        # confused the two action names. The unified `codecov-action`
        # IS at v5 and accepts `report_type` to switch between coverage
        # and test-results uploads.
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          report_type: test_results
          flags: rust-tests
          name: rust-igraph-tests
          fail_ci_if_error: false
