name: Coverage

# Runs in its own workflow so the daily-driver CI (`ci.yml`) stays fast
# and Python-free. Two parallel jobs, both upload to Codecov via the
# unified `codecov/codecov-action@v6`:
#   - llvm-cov:    line/branch coverage (cargo-llvm-cov → lcov.info)
#   - test-results: per-test analytics (cargo-nextest → junit.xml,
#                   `report_type: test_results`)

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  llvm-cov:
    name: line coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    env:
      # llvm-cov instrumentation can surface dead-code lints the rest
      # of CI doesn't see; clear `-D warnings` so they don't fail us.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      # Oracle tests need python-igraph at runtime.
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - name: Install python-igraph
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r scripts/requirements.txt

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with: { tool: cargo-llvm-cov }

      - name: Generate lcov coverage report
        # `--doctests` would require nightly; the doc job already
        # builds them with -D warnings, so the extra coverage signal
        # is not worth a toolchain split.
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          flags: rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-results:
    name: test analytics (cargo-nextest → JUnit)
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest }

      - name: Run nextest with JUnit report
        # The `ci` profile in `.config/nextest.toml` writes
        # `target/nextest/ci/junit.xml`. `--features proptest-harness`
        # (no `oracle-tests`) keeps the suite pure-Rust so this job
        # doesn't need a python-igraph venv. `|| true` keeps the job
        # green even if a test fails so the JUnit upload still happens.
        run: cargo nextest run --workspace --features proptest-harness --profile ci || true

      - name: Upload test results to Codecov
        # Unified `codecov-action@v5` with `report_type: test_results`
        # is the path Codecov themselves recommend (the v1
        # `test-results-action` is deprecated).
        if: always()
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          report_type: test_results
          flags: rust-tests
          name: rust-igraph-tests
          fail_ci_if_error: false
