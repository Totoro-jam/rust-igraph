name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  clippy:
    name: clippy (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.85"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.toolchain }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
        os: [ubuntu-latest, macos-latest]
        exclude:
          - toolchain: beta
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-fail-fast

  conformance:
    name: conformance (3-source fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --test conformance

  oracle:
    name: oracle (vs python-igraph)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install python-igraph
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r scripts/requirements.txt
          .venv/bin/python -c "import igraph; print('python-igraph', igraph.__version__)"
      - name: Run oracle tests
        run: cargo test --features oracle-tests --test oracle

  proptest:
    name: proptest invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features proptest-harness --test property

  deny:
    name: cargo-deny (license + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check }

  wasm:
    name: wasm32 check (default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      # Phase 0: only the no-features check (faer/bliss feature gating
      # arrives in Phase 1). Once those features land, switch to:
      #   --no-default-features --features faer-backend,bliss-rust
      - run: cargo check --target wasm32-unknown-unknown --no-default-features

  doc:
    name: cargo doc (broken-link-aware)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps

  coverage:
    name: coverage (cargo-llvm-cov + codecov)
    runs-on: ubuntu-latest
    # Coverage runs every suite the rest of CI runs in a single
    # instrumentation pass — `--all-features` flips on both
    # `oracle-tests` and `proptest-harness`, and `--workspace
    # --doctests` picks up every crate plus the doctest surface.
    # Drops `-D warnings` because llvm-cov's instrumentation can
    # surface dead-code lints that the regular jobs don't see.
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      # Oracle tests need python-igraph at runtime.
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install python-igraph (for oracle suite)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r scripts/requirements.txt

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with: { tool: cargo-llvm-cov }

      - name: Generate lcov coverage report
        run: |
          cargo llvm-cov --workspace --all-features --doctests \
            --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
