name: Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            Welcome to **rust-igraph**! :wave: Thanks for opening your first pull request.

            A maintainer will review it shortly. In the meantime, please make sure:
            - [ ] `cargo test --workspace` passes locally
            - [ ] `cargo clippy --workspace --all-targets -- -D warnings` is clean
            - [ ] New public APIs have rustdoc with at least one doctest

            Feel free to ask questions — we're happy to help!
          issue-message: |
            Welcome to **rust-igraph**! :wave: Thanks for opening your first issue.

            We appreciate the report. A maintainer will look into it as soon as possible.
            If this is a bug, including a minimal reproducer (a small code snippet) helps a lot!
