name: Release

# Triggered by pushing a tag of the form v*. Verifies the package and
# publishes to crates.io. Requires CARGO_REGISTRY_TOKEN in repo secrets
# (Settings -> Secrets and variables -> Actions).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip cargo publish)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  publish:
    name: Verify + publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install python-igraph for the oracle smoke
        uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r scripts/requirements.txt

      - name: Pre-flight gate (mirrors `phase-checkpoint`)
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test  --workspace --all-features --no-fail-fast
          cargo doc   --workspace --no-deps
          cargo check --target wasm32-unknown-unknown --no-default-features

      - name: Verify package contents
        run: |
          cargo package --list
          cargo publish --dry-run --allow-dirty

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag $TAG does not match Cargo.toml version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Publish to crates.io
        if: |
          startsWith(github.ref, 'refs/tags/v') &&
          github.event_name != 'workflow_dispatch'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      - name: Publish (manual dispatch, dry_run=false)
        if: |
          github.event_name == 'workflow_dispatch' &&
          inputs.dry_run == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
