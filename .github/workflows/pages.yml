name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Verify WASM crate compiles
      - name: Check WASM crate
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --target wasm32-unknown-unknown -p igraph-wasm

      # Build rustdoc
      - name: Build rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps

      # Build mdBook
      - name: Install mdBook
        run: cargo install mdbook --locked --version 0.4.51
      - name: Build mdBook
        run: mdbook build book

      # Build website (landing page)
      - name: Build website
        working-directory: website
        run: |
          npm ci
          npx vite build --base /rust-igraph/

      # Assemble site: website at /, rustdoc at /rust_igraph/, book at /book/
      # Order: rustdoc first (includes static.files/, src/, search.index/,
      # trait.impl/, type.impl/ that rustdoc HTML refs via ../), then website
      # overlay (higher priority), then mdBook.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r target/doc/* _site/
          cp -r website/dist/* _site/
          mkdir -p _site/book
          cp -r book/book/* _site/book/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
