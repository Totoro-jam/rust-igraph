name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Build rustdoc
      - name: Build rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps

      # Build mdBook
      - name: Install mdBook
        run: cargo install mdbook --locked --version 0.4.51
      - name: Build mdBook
        run: mdbook build book

      # Assemble site: rustdoc at /rust_igraph/, book at /book/
      - name: Assemble site
        run: |
          mkdir -p target/doc/book
          cp -r book/book/* target/doc/book/
          echo '<meta http-equiv="refresh" content="0; url=rust_igraph/index.html">' > target/doc/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
