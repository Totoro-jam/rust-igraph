[package]
name = "rust-igraph"
version = "0.0.1-alpha.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later"
description = "Pure-Rust port of the igraph network analysis library (alpha — Phase 0)."
repository = "https://github.com/Totoro-jam/rust-igraph"
homepage = "https://Totoro-jam.github.io/rust-igraph"
documentation = "https://docs.rs/rust-igraph"
readme = "README.md"
keywords = ["graph", "network", "igraph", "algorithm"]
categories = ["data-structures", "science", "mathematics"]
authors = ["rust-igraph contributors"]
include = [
    "/src/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]

[features]
default = []
# Enable to run the live python-igraph oracle integration tests.
# Requires .venv/ at the repo root with python-igraph installed
# (see scripts/requirements.txt).
oracle-tests = []
# Marker-only feature: proptest is always in dev-dependencies; this gates
# the test bodies so plain `cargo test` stays fast.
proptest-harness = []

[dependencies]
thiserror = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
criterion = "0.5"

[[example]]
name = "bfs_karate"
path = "examples/bfs_karate.rs"

[[bench]]
name = "bench_bfs"
path = "benches/bench_bfs.rs"
harness = false

[[bench]]
name = "bench_dfs"
path = "benches/bench_dfs.rs"
harness = false

[[bench]]
name = "bench_cc"
path = "benches/bench_cc.rs"
harness = false

[[bench]]
name = "bench_scc"
path = "benches/bench_scc.rs"
harness = false

[[bench]]
name = "bench_distances"
path = "benches/bench_distances.rs"
harness = false

[[bench]]
name = "bench_eulerian"
path = "benches/bench_eulerian.rs"
harness = false

[[bench]]
name = "bench_articulation"
path = "benches/bench_articulation.rs"
harness = false

[[bench]]
name = "bench_bridges"
path = "benches/bench_bridges.rs"
harness = false

[[bench]]
name = "bench_girth"
path = "benches/bench_girth.rs"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
