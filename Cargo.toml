[package]
name = "rust-igraph"
version = "0.5.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later"
description = "Pure-Rust, high-performance graph & network analysis library — 1200+ APIs, zero unsafe, igraph-compatible"
repository = "https://github.com/Totoro-jam/rust-igraph"
homepage = "https://Totoro-jam.github.io/rust-igraph"
documentation = "https://docs.rs/rust-igraph"
readme = "README.md"
keywords = ["graph", "network-analysis", "igraph", "graph-algorithms", "complex-networks"]
categories = ["algorithms", "data-structures", "science", "mathematics"]
authors = ["rust-igraph contributors"]
include = [
    "/src/**/*.rs",
    "/examples/**/*.rs",
    "/fixtures/karate.edges",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[features]
default = []
# Enable to run the live python-igraph oracle integration tests.
# Requires .venv/ at the repo root with python-igraph installed
# (see scripts/requirements.txt).
oracle-tests = []
# Marker-only feature: proptest is always in dev-dependencies; this gates
# the test bodies so plain `cargo test` stays fast.
proptest-harness = []

[dependencies]
thiserror = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
criterion = "0.5"

