[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Triggered by the rustc test harness once the per-crate test
# count grows large: it emits a stack-allocated array of TestDescAndFn
# entries that crosses the 16 KB heuristic. Nothing in our own code
# allocates an array that large.
large_stack_arrays = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
