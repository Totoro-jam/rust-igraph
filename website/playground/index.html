<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playground — rust-igraph</title>
  <meta name="description" content="Run rust-igraph graph algorithms in the browser via WebAssembly.">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="playground.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/rust-igraph/" class="nav-logo">
        <span class="logo-text">rust-igraph</span>
      </a>
      <div class="nav-links">
        <a href="/rust-igraph/book/">Guide</a>
        <a href="/rust-igraph/rust_igraph/">API Docs</a>
        <a class="nav-active">Playground</a>
        <a href="https://github.com/Totoro-jam/rust-igraph" class="nav-github" aria-label="GitHub">
          <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <button class="theme-toggle" aria-label="Toggle theme" onclick="toggleTheme()">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="playground">
    <div class="panel panel-left">
      <div class="panel-header">
        <h2>Graph Definition</h2>
        <div class="controls">
          <label><input type="checkbox" id="directed"> Directed</label>
          <button id="btn-run" class="btn-run">Run</button>
        </div>
      </div>
      <textarea id="edge-input" spellcheck="false" placeholder="Enter edges, one per line:
0 1
1 2
2 3
3 0
2 4
4 5">0 1
1 2
2 3
3 0
2 4
4 5
5 3</textarea>

      <div class="algo-picker">
        <h3>Algorithm</h3>
        <select id="algo-select">
          <option value="pagerank">PageRank</option>
          <option value="louvain">Louvain Community Detection</option>
          <option value="betweenness">Betweenness Centrality</option>
          <option value="bfs">BFS (from vertex 0)</option>
          <option value="components">Connected Components</option>
        </select>
      </div>
    </div>

    <div class="panel panel-right">
      <div class="panel-header">
        <h2>Results</h2>
        <div id="status" class="status">Loading WASM...</div>
      </div>
      <canvas id="graph-canvas"></canvas>
      <pre id="output" class="output"></pre>
    </div>
  </main>

  <script type="module" src="playground.js"></script>
</body>
</html>
