<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page Not Found | rust-igraph</title>
  <link rel="icon" type="image/svg+xml" href="/rust-igraph/assets/favicon.svg">
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
    [data-theme="dark"] {
      --bg: #0d1117;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --border: #30363d;
      --bg-code: #1c2128;
    }
    [data-theme="light"] {
      --bg: #ffffff;
      --text: #24292f;
      --text-muted: #57606a;
      --accent: #0969da;
      --accent-hover: #0550ae;
      --border: #d0d7de;
      --bg-code: #f6f8fa;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .code { font-size: 6rem; font-weight: 800; color: var(--accent); line-height: 1; }
    .msg { font-size: 1.25rem; color: var(--text-muted); margin: 1rem 0 2rem; max-width: 480px; }
    .links { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
    .links a {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }
    .links .primary { background: var(--accent); color: #fff; }
    .links .primary:hover { background: var(--accent-hover); }
    .links .secondary {
      border: 1px solid var(--border);
      color: var(--text);
      background: transparent;
    }
    .links .secondary:hover { background: var(--bg-code); }
    .graph {
      margin-bottom: 2rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.6;
      white-space: pre;
    }
  </style>
  <script>
    (function() {
      var stored = localStorage.getItem('theme');
      var pref = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', pref);
    })();
  </script>
</head>
<body>
  <div class="graph">    0 --- 1
   / \     |
  4   3 - 2
       \
    ? - 404</div>
  <div class="code">404</div>
  <p class="msg">This vertex doesn't exist in the graph. The page you're looking for may have been moved or removed.</p>
  <div class="links">
    <a class="primary" href="/rust-igraph/">Home</a>
    <a class="secondary" href="/rust-igraph/book/">Guide</a>
    <a class="secondary" href="/rust-igraph/rust_igraph/">API Docs</a>
    <a class="secondary" href="/rust-igraph/playground/">Playground</a>
  </div>
</body>
</html>
